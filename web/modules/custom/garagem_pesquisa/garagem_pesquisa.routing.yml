garagem_pesquisa.page:
  path: '/pesquisa'
  defaults:
    _controller: '\Drupal\garagem_pesquisa\Controller\PesquisaController::page'
    _title: 'Pesquisar Garagens'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: true

garagem_pesquisa.ajax:
  path: '/pesquisa/ajax'
  defaults:
    _controller: '\Drupal\garagem_pesquisa\Controller\PesquisaController::ajax'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: true
