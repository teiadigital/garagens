services:
  management_armazens.notificacao_garagem:
    class: Drupal\management_armazens\Service\NotificacaoGaragemService
    arguments:
      - '@entity_type.manager'
      - '@message_notify.sender'
  management_armazens.armazem_redirect_subscriber:
    class: Drupal\management_armazens\EventSubscriber\ArmazemRedirectSubscriber
    tags:
      - { name: event_subscriber }
  management_armazens.sanitize_login_redirect:
    class: Drupal\management_armazens\EventSubscriber\SanitizeLoginRedirectSubscriber
    tags:
      - { name: event_subscriber }
  management_armazens.password_reset_access_subscriber:
    class: Drupal\management_armazens\EventSubscriber\PasswordResetAccessSubscriber
    arguments:
      - '@current_user'
    tags:
      - { name: event_subscriber }
