services:
  garagem_reservas.preco:
    class: Drupal\garagem_reservas\Service\PrecoService

  garagem_reservas.disponibilidade:
    class: Drupal\garagem_reservas\Service\DisponibilidadeService
    arguments: ['@database']

  garagem_reservas.notificacao:
    class: Drupal\garagem_reservas\Service\NotificacaoService
    arguments:
      - '@database'
      - '@language_manager'
      - '@entity_type.manager'
      - '@message_notify.sender'

  garagem_reservas.commerce:
    class: Drupal\garagem_reservas\Service\CommerceService
    arguments:
      - '@database'
      - '@entity_type.manager'

  garagem_reservas.commerce_order_subscriber:
    class: Drupal\garagem_reservas\EventSubscriber\CommerceOrderEventSubscriber
    arguments: ['@database']
    tags:
      - { name: event_subscriber }
