settings:
  terms: "1. Introdução\r\nBem-vindo à Stor’It Flex, plataforma de partilha de armazéns propriedade de Resultados e Escolhas - Armazéns Online Lda. Os presentes termos e condições de uso (“Termos e Condições”) regem a política de utilização deste website, incluindo todo o\r\nconteúdo, funcionalidades e serviços oferecidos através do mesmo (doravante designado por “Stor’It”).\r\n\r\nAo aceder ou utilizar a Stor’It, o utilizador concorda com os seguintes Termos e Condições e vincula-se aos seus princípios e considerações. Caso não corrobore desta intenção ou, de qualquer outra forma, não concorde com os presentes Termos e Condições, não pode utilizar a Stro’It.\r\n\r\n2. Alterações aos Termos e Condições\r\nA Resultados e Escolhas reserva o direito de, a qualquer momento e sem aviso prévio, alterar os presentes Termos e Condições. As alterações entrarão em vigor imediatamente\r\napós a publicação dos Termos e Condições atualizados no Website. Ao utilizar a Stor’It após a publicação de quaisquer alterações aos Termos e Condições, o utilizador concorda e fica vinculado pelos Termos e Condições atualizados.\r\n\r\n3. Uso do Website\r\nO utilizador pode utilizar a Stor’It apenas para fins legais e de acordo com os presentes Termos e Condições. Desta forma, concorda em não utilizar a Stor’It:\r\nEm toda e qualquer utilização que viole qualquer lei vigente ou regulamento aplicável;\r\nEm toda e qualquer utilização que acarrete prejuízo para a Stor’It, seu website e respetivo desempenho;\r\nPara fins fraudulentos ou enganosos;\r\nPara recolher informações de outros utilizadores sem o seu consentimento expresso;\r\nPara transmitir, ou solicitar o envio de, qualquer publicidade não solicitada ou não autorizada ou materiais promocionais, spam ou qualquer outra forma de solicitação;\r\nPara interferir com o uso e aproveitamento de outras pessoas da Stor’It;\r\nPara enviar, receber, fazer upload, descarregar, utilizar ou reutilizar qualquer material que não cumpra com os presentes Termos e Condições;\r\nPara transmitir qualquer vírus, cavalo de Tróia, worm, bomba relógio, ou outros materiais maliciosos ou tecnologicamente prejudiciais;\r\nPara atacar a Stor’It, e seu website, através de um ataque de negação de serviço ou de um ataque de distribuição de serviço;\r\nPara utilizar qualquer técnica de mineração de dados, “scraping” ou “crawling” para extrair informações do Website.\r\n\r\n4. Preços\r\nO serviço de divulgação de imóveis prestado pela Stor’It nesta fase promocional não terá qualquer custo. Após a fase promocional, com duração exata de 60 dias contados a partir da data de registo de cada imóvel no website, o imóvel deixa de estar ativo e o registo do mesmo é devolvido ao proprietário para que possa efetuar as alterações que julgue necessárias, incluído os preços. Após as correções e revalidação da informação pode proceder a nova submissão da publicação.\r\n\r\nTodas e quaisquer alterações efetuadas por proprietários de um ou mais imóveis, incluindo preços, só produzirão efeitos a partir da data em que voltem a ser submetidos e após obterem a aprovação por parte da equipa de gestão Stor’It. As alterações efetuadas e os efeitos propostos nunca terão efeitos retroativos, pelo que não se aplicam a reservas ou contratações já estabelecidas.\r\n\r\nA reserva ou contratação de serviços divulgados pela Stor’It terão os custos indicados pelos proprietários dos imóveis publicados e se aplicável acrescidos pelos encargos inerentes à utilização da plataforma.\r\n\r\n5. Propriedade Intelectual\r\nA Stor’It, o seu website, todo o conteúdo e materiais incluídos, inclusive, o design, layout, logotipos, marcas, texto, imagens, gráficos, software, códigos e outros materiais (“Conteúdo”), são protegidos por direitos de propriedade intelectual e outras leis aplicáveis.\r\n\r\nO utilizador concorda em não reproduzir, distribuir, modificar, criar trabalhos derivados, exibir, executar, publicar, transmitir ou explorar de outra forma qualquer parte do Conteúdo, exceto se expressamente permitido pela Stor’It e sua proprietária Resultados e Escolhas - Armazéns Online, Lda.\r\n\r\n5. Isenção de Responsabilidade\r\nO website fornecido “tal como se apresenta” e fora “disponibilizado” não assume qualquer garantia de que o seu conteúdo atende às necessidades ou expectativas do utilizador, ou que o seu acesso seja ininterrupto, sem erros e totalmente seguro.\r\n\r\nA Stor’It e seus representantes legais não são portanto responsáveis por quaisquer danos ou prejuízos resultantes do uso ou incapacidade de uso do website, incluindo, sem limitação, quaisquer danos diretos, indiretos, incidentais, especiais, consequentes ou punitivos, perda de lucros ou danos similares, mesmo que tenhamos sido informados da possibilidade de tais danos.\r\n\r\nA informação relativa a cada imóvel publicado, é da única e exclusiva responsabilidade do proprietário, não podendo de forma alguma ser imputada qualquer responsabilidade aos proprietários e/ou responsáveis da Stor’it.\r\n\r\n6. Política de Privacidade\r\nA utilização do website está sujeita à Política de Privacidade. Ao utilizar o Website, o utilizador concorda com a nossa recolha, utilização e divulgação de informações pessoais para os fins estritamente necessários ao normal funcionamento desta plataforma e aos fins a que se destina.\r\n\r\n7. Ligação a Websites de Terceiros\r\nO Website pode conter links para outros websites, propriedade de terceiros, e sobre a qual a Stor’It não tem qualquer responsabilidade ou domínio de atuação. Não há responsabilidade pelo conteúdo, políticas de privacidade ou práticas de quaisquer websites de terceiros. Deste modo, o utilizador reconhece e concorda que não somos responsáveis por quaisquer danos ou prejuízos resultantes do uso de outros websites.\r\n\r\n8. Rescisão\r\nReservamo-nos o direito de rescindir ou suspender o acesso do utilizador à Stor’It e ao seu website, sem aviso prévio, por qualquer motivo ou sem motivo algum.\r\n\r\nTodo e qualquer imóvel submetido para publicação/divulgação na Stor’It fica sujeito a uma validação por parte da equipa de gestão da Stor’It e caso não esteja de acordo com princípios gerais, incluindo referências para localização exata do imóvel em campos de preenchimento livre, não será aceite o registo e será devolvido ao proprietário para efetuar as alterações que lhe serão indicadas quando da devolução.\r\n\r\n9. Lei Aplicável e Jurisdição\r\nOs presentes Termos e Condições serão regidos e interpretados de acordo com as leis de Portugal, sem dar efeito a qualquer princípio de conflito de leis. O utilizador concorda que qualquer disputa decorrente ou relacionada com estes Termos e Condições será resolvida exclusivamente pelos tribunais Portugueses.\r\n\r\n10. Disposições Gerais\r\nEstes Termos e Condições constituem o acordo completo entre o utilizador e a Stor’It em relação ao uso do website e substituem todos os acordos anteriores ou contemporâneos entre o utilizador e a Stor’It.\r\nSe qualquer disposição destes Termos e Condições for considerada inválida ou inexequível por qualquer tribunal competente, as restantes disposições destes Termos e Condições permanecerão em pleno vigor e efeito.\r\nA falha no cumprimento de qualquer direito ou disposição destes Termos e Condições não será considerada uma renúncia a esses direitos.\r\n"
